<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FACEIT Scout</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>FACEIT Scout</h1>
        <span id="connection-status">Local or remote backend</span>
      </header>

      <section>
        <label>
          Backend URL (localhost or your HTTPS server)
          <input id="backend-url" type="url" />
        </label>
        <label>Import access key<input id="import-key" type="password" autocomplete="off" /></label>
        <label>Download destination
          <select id="download-mode"><option value="server">Backend downloads and parses (v2)</option><option value="browser">Browser download folder (legacy)</option></select>
        </label>
        <button id="save-connection" type="button">Save connection / grant host permission</button>
        <label>
          FACEIT player ID or nickname
          <input id="player-id" autocomplete="off" />
        </label>
        <label>
          Download subdirectory
          <input id="download-subdirectory" />
        </label>
      </section>

      <section>
        <label>
          Current match ID
          <input id="match-id" autocomplete="off" />
        </label>
        <label>
          Map
          <input id="selected-map" placeholder="de_inferno" />
        </label>
        <div class="actions">
          <button id="detect-match" type="button">Detect</button>
          <button id="start-analysis" type="button">Analyze</button>
        </div>
      </section>

      <p id="message" role="status"></p>

      <section id="fallback-analysis" class="fallback" hidden>
        <div>
          <h2>No 4-stack history found</h2>
          <p>Try a broader search using 3 shared opponents instead.</p>
        </div>
        <button id="fallback-analysis-button" class="secondary" type="button">Analyze using 3 premade</button>
      </section>

      <section id="results" hidden>
        <div class="result-heading">
          <h2>Historical matches</h2>
          <div class="compact-actions">
            <button id="select-all" class="secondary" type="button">Select first 3</button>
            <button id="unselect-all" class="secondary" type="button">Unselect all</button>
            <button id="download-all" type="button">Import first 3</button>
          </div>
        </div>
        <div id="opponents"></div>
        <div id="candidate-list"></div>
        <div class="actions">
          <button id="download-selected" type="button">Import selected (max 3)</button>
        </div>
      </section>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
