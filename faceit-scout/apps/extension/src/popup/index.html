<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FACEIT Scout</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>FACEIT Scout</h1>
        <span id="connection-status">Local backend</span>
      </header>

      <section>
        <label>
          Backend URL
          <input id="backend-url" type="url" />
        </label>
        <label>
          FACEIT player ID or nickname
          <input id="player-id" autocomplete="off" />
        </label>
        <label>
          Download subdirectory
          <input id="download-subdirectory" />
        </label>
      </section>

      <section>
        <label>
          Current match ID
          <input id="match-id" autocomplete="off" />
        </label>
        <label>
          Map
          <input id="selected-map" placeholder="de_inferno" />
        </label>
        <div class="actions">
          <button id="detect-match" type="button">Detect</button>
          <button id="start-analysis" type="button">Analyze</button>
        </div>
      </section>

      <p id="message" role="status"></p>

      <section id="results" hidden>
        <div class="result-heading">
          <h2>Historical matches</h2>
          <div class="compact-actions">
            <button id="select-all" class="secondary" type="button">Select all</button>
            <button id="unselect-all" class="secondary" type="button">Unselect all</button>
            <button id="download-all" type="button">Download all</button>
          </div>
        </div>
        <div id="opponents"></div>
        <div id="candidate-list"></div>
        <div class="actions">
          <button id="download-selected" type="button">Download selected</button>
        </div>
      </section>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
