[project]
name = "faceit-scout-processor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "demoparser2>=0.39.0",
  "polars>=1.14.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "watchfiles>=0.24.0",
  "zstandard>=0.23.0",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "pytest-asyncio>=0.24.0", "ruff>=0.7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
