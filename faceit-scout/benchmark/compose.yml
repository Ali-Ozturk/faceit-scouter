services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: benchmark
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30
  migrate:
    image: faceit-scout-benchmark-migrate:local
    build:
      context: ../apps/web
      dockerfile: ../../benchmark/migrate.Dockerfile
    environment:
      DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/benchmark
    depends_on:
      postgres:
        condition: service_healthy
  processor:
    image: faceit-scout-benchmark-processor:local
    build: ../apps/processor
    environment:
      PYTHONPATH: /app
      INCOMING_FILES_ARE_COMPLETE: "true"
      DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/benchmark
      FACEIT_API_TOKEN: ""
      PROCESSOR_CONCURRENCY: ${BENCH_CONCURRENCY:-1}
      INCOMING_DIRECTORY: /data/incoming
      PROCESSING_DIRECTORY: /data/processing
      COMPLETED_DIRECTORY: /data/completed
      FAILED_DIRECTORY: /data/failed
      DECOMPRESSED_DIRECTORY: /data/decompressed
      TEMPORARY_DIRECTORY: /data/temporary
      OPENING_TENDENCY_PREVIEWS_ENABLED: ${BENCH_OPENING_PREVIEWS:-false}
      PARSE_FULL_SCOREBOARD: ${BENCH_FULL_SCOREBOARD:-false}
    volumes:
      - work:/data
      - ${BENCH_INPUTS:?Run through benchmark/run.py}:/inputs:ro
      - ${BENCH_REPORT:?Run through benchmark/run.py}:/report
      - ./:/benchmark:ro
    command: ["python", "/benchmark/batch.py"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  database:
  work:
