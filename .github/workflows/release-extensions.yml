name: Publish browser extensions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-extensions-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            faceit-scout/apps/extension/package-lock.json
            faceit-scout/apps/extension-firefox/package-lock.json

      - name: Install Chrome extension dependencies
        working-directory: faceit-scout/apps/extension
        run: npm ci

      - name: Test and build Chrome extension
        working-directory: faceit-scout/apps/extension
        run: |
          npm test
          npm run build

      - name: Install Firefox extension dependencies
        working-directory: faceit-scout/apps/extension-firefox
        run: npm ci

      - name: Test and build Firefox extension
        working-directory: faceit-scout/apps/extension-firefox
        run: |
          npm test
          npm run build

      - name: Set extension versions from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Release tag must be v followed by 1-4 numeric components, for example v0.2.0." >&2
            exit 1
          fi
          VERSION="$version" node <<'NODE'
          const fs = require("fs");
          for (const file of [
            "faceit-scout/apps/extension/dist/manifest.json",
            "faceit-scout/apps/extension-firefox/dist/manifest.json",
          ]) {
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          }
          NODE

      - name: Verify extension manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f faceit-scout/apps/extension/dist/manifest.json
          test -f faceit-scout/apps/extension-firefox/dist/manifest.json
          node -e "JSON.parse(require('fs').readFileSync('faceit-scout/apps/extension/dist/manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('faceit-scout/apps/extension-firefox/dist/manifest.json'))"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          safe_tag="${RELEASE_TAG//\//-}"
          (
            cd faceit-scout/apps/extension/dist
            zip -q -r "../../../../release-assets/faceit-scout-chrome-${safe_tag}.zip" .
          )
          (
            cd faceit-scout/apps/extension-firefox/dist
            zip -q -r "../../../../release-assets/faceit-scout-firefox-${safe_tag}.zip" .
          )
          cd release-assets
          sha256sum ./*.zip > SHA256SUMS.txt
          unzip -t "faceit-scout-chrome-${safe_tag}.zip"
          unzip -t "faceit-scout-firefox-${safe_tag}.zip"

      - name: Create release or replace extension assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
